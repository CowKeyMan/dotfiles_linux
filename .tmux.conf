# git config --global core.autocrlf false
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# ctrl + I to download plugins

# Set ctrl+s as the leader
unbind-key C-b
set-option -g prefix C-q
bind-key C-q send-prefix

# press r to reload source file
# unbind r
# bind r source-file ~/.tmux.conf

# swap window to left or right
bind-key -r < swap-window -t -1
bind-key -r > swap-window -t +1

set -g mouse on

# move panes like vim
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -U
bind-key k select-pane -D
bind-key l select-pane -R
bind-key C-h select-pane -L
bind-key C-j select-pane -U
bind-key C-k select-pane -D
bind-key C-l select-pane -R


# ctrl+u = next-window
bind-key -n M-h previous-window
bind-key -n M-l next-window

# This is so that vim does not delay when going to normal mode
set -sg escape-time 0

# Normal colors in vim
# set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set  -g default-terminal "tmux-256color"
# set -sa terminal-overrides ",xterm-*:Tc"

# do not prompt before killing a pane
bind-key x kill-pane

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 5

# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on


# location of status bar
set -g status-position top

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# keybindings for normal mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# plugins for tmux
set -g @plugin 'tmux-plugins/tpm'
## status bar
set -g @plugin 'dracula/tmux'
set -g @dracula-show-powerline false
set -g @dracula-plugins " " # Other values do not work well with wsl!
set -g @dracula-show-left-icon session
## yanking in visual mode
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
run '~/.tmux/plugins/tpm/tpm'

set -g @resurrect-default-processes 0

# remove the annoying asteriks
set-window-option -g window-status-current-format "#[fg=#f8f8f2,bg=#6272a4] [#W] "
set-window-option -g window-status-format "#[fg=#f8f8f2]#[bg=#44475a] #W "

run -b '~/.tmux/plugins/tmux-resurrect/scripts/restore.sh r'  # Call tmux-resurrect restore on startup
